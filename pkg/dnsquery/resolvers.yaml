# Encrypted, non-filtering resolvers using DNSCrypt, DNS-over-HTTPS and DNS-over-TLS.
# DNSCrypt stamps come from the upstream public-resolvers catalog; DoH and DoT
# endpoints follow the providers' published configuration.
#
# Try to choose ones that have been running long-term and are not blocked in China.
# Since one of the purposes of the built‑in DNS resolver is to bypass such restrictions.
#
# See: https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md
# See: https://developers.cloudflare.com/1.1.1.1/encryption/
# See: https://developers.google.com/speed/public-dns/docs/secure-transports
# See: https://quad9.net/service/service-addresses-and-features/
# See: https://adguard-dns.io/en/public-dns.html
# See: https://dns.sb/doh/
# See: https://dns.sb/dot/
# See: https://controld.com/free-dns

# The first discovery batch spans protocols and operators

- name: "cloudflare-doh"
  server: "https://cloudflare-dns.com/dns-query"

- name: "adguard-unfiltered-dot"
  server: "tls://unfiltered.adguard-dns.com"

- name: "quad9-unfiltered-dnscrypt-primary"
  server: "sdns://AQcAAAAAAAAADTkuOS45LjEwOjg0NDMgZ8hHuMh1jNEgJFVDvnVnRt803x2EwAuMRwNo34Idhj4ZMi5kbnNjcnlwdC1jZXJ0LnF1YWQ5Lm5ldA"

- name: "google-doh"
  server: "https://dns.google/dns-query"

# Additional DNS-over-HTTPS (DoH)

- name: "quad9-unfiltered-doh"
  server: "https://dns10.quad9.net/dns-query"

- name: "adguard-unfiltered-doh"
  server: "https://unfiltered.adguard-dns.com/dns-query"

- name: "dns-sb-doh"
  server: "https://doh.dns.sb/dns-query"

- name: "controld-unfiltered-doh"
  server: "https://freedns.controld.com/p0"

# Additional DNS-over-TLS (DoT)

- name: "cloudflare-dot"
  server: "tls://one.one.one.one"

- name: "google-dot"
  server: "tls://dns.google"

- name: "quad9-unfiltered-dot"
  server: "tls://dns10.quad9.net"

- name: "dns-sb-dot"
  server: "tls://dot.sb"

- name: "controld-unfiltered-dot"
  server: "tls://p0.freedns.controld.com"

