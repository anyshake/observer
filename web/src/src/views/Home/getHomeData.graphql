query getHomeData {
    getCurrentTime
    getStationConfig
    getDeviceId
    getCurrentUser {
        admin
    }
    getDeviceConfig {
        packetInterval
        sampleRate
        channelCodes
        gnssEnabled
        model
        protocol
    }
    getDeviceInfo {
        latitude
        longitude
        elevation
        temperature
    }
    getDeviceStatus {
        startedAt
        updatedAt
        frames
        errors
        messages
        gnssStatus {
            locked
            fixValid
            timeValid
            hdop
            satellites
            ppsAgeSeconds
        }
    }
    getServiceStatus {
        serviceId
        isRunning
        name
        description
        restarts
        startedAt
        stoppedAt
    }
    getSystemStatus {
        cpu
        memory
        disk
        uptime
    }
}
